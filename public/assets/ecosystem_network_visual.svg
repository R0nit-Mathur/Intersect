<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#0E0E0D"/>
      <!-- Grid Lines -->
      <g stroke="#222220" stroke-width="1">
        <line x1="0" y1="200" x2="1200" y2="200"/>
        <line x1="0" y1="400" x2="1200" y2="400"/>
        <line x1="0" y1="600" x2="1200" y2="600"/>
        <line x1="300" y1="0" x2="300" y2="800"/>
        <line x1="600" y1="0" x2="600" y2="800"/>
        <line x1="900" y1="0" x2="900" y2="800"/>
      </g>
      <!-- Ecosystem Network Nodes -->
      <g stroke="#E8E8E3" stroke-width="2">
        <line x1="300" y1="400" x2="600" y2="200"/>
        <line x1="600" y1="200" x2="900" y2="400"/>
        <line x1="900" y1="400" x2="600" y2="600"/>
        <line x1="600" y1="600" x2="300" y2="400"/>
        <line x1="300" y1="400" x2="900" y2="400"/>
        <line x1="600" y1="200" x2="600" y2="600"/>
      </g>
      <circle cx="300" cy="400" r="18" fill="#E8E8E3"/>
      <circle cx="600" cy="200" r="24" fill="#E8E8E3"/>
      <circle cx="900" cy="400" r="18" fill="#E8E8E3"/>
      <circle cx="600" cy="600" r="22" fill="#E8E8E3"/>
      <circle cx="600" cy="400" r="32" fill="#E8E8E3"/>
      <!-- Concentric rings around center -->
      <circle cx="600" cy="400" r="70" stroke="#E8E8E3" stroke-width="1.5" stroke-dasharray="8 8"/>
      <circle cx="600" cy="400" r="130" stroke="#444440" stroke-width="1"/>
      <text x="600" y="405" fill="#0E0E0D" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">150K+</text>
      <text x="600" y="720" fill="#938F8A" font-family="monospace" font-size="14" letter-spacing="6" text-anchor="middle">INTERSECT GLOBAL DEVELOPER ECOSYSTEM</text>
    </svg>